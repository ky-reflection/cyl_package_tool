[package]
name = "cyl_package_tool"
version = "0.1.2"
edition = "2021"

[features]
default = ["gui"]
viewer = ["dep:clap", "dep:svg", "dep:resvg", "dep:usvg", "dep:tiny-skia", "dep:anyhow"]
gui = ["dep:eframe", "dep:rfd", "dep:wgpu"]

[dependencies]
getset = "0.1.2"
regex = "1.10.5"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"

# viewer (SVG/PNG preview)
clap = { version = "4.5.40", features = ["derive"], optional = true }
svg = { version = "0.18.0", optional = true }
resvg = { version = "0.45.1", optional = true }
usvg = { version = "0.45.1", optional = true }
tiny-skia = { version = "0.11.4", optional = true }
anyhow = { version = "1.0.98", optional = true }

# gui (C2→C1 converter)
eframe = { version = "0.28.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"], optional = true }
rfd = { version = "0.14.1", optional = true }

[target.'cfg(windows)'.dependencies]
# eframe 0.28 disables wgpu's defaults; selecting DX12 at runtime also requires this feature.
wgpu = { version = "0.20.1", default-features = false, features = ["dx12"], optional = true }

[[bin]]
name = "c2to1_converter"
path = "src/bin/cytus_chart_2to1_tool.rs"
required-features = ["gui"]

[[bin]]
name = "chart_viewer"
path = "src/bin/cytus2_chart_viewer.rs"
required-features = ["viewer"]

[[test]]
name = "chart_viewer"
path = "tests/chart_viewer.rs"
required-features = ["viewer"]
